name: Optimizar imágenes subidas

# Corre después de cualquier push a main que toque src/assets (venga del
# panel /admin o de un push manual): renombra las imágenes NUEVAS según la
# carpeta donde quedaron (ej: subida a la carpeta de "ns235" o "nicho" pasa
# a terminar en "-ns235"/"-nicho") y comprime lo que cambió en ese push. Si
# logra achicar/renombrar algo, lo sube en un commit aparte del bot — por
# eso el deploy no espera a este workflow: sale con el contenido tal cual
# se subió primero, y el commit de este workflow dispara otro deploy
# después con los nombres/pesos ya prolijos.
on:
  push:
    branches: [main]
    paths:
      - "src/assets/**/*.png"
      - "src/assets/**/*.jpg"
      - "src/assets/**/*.jpeg"
      - "src/assets/**/*.webp"

permissions:
  contents: write

jobs:
  optimizar:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias
        run: npm ci

      - name: Detectar imágenes nuevas (para renombrar)
        id: nuevas
        run: |
          ARCHIVOS=$(git diff --name-only --diff-filter=A "${{ github.event.before }}" "${{ github.event.after }}" -- 'src/assets/**/*.png' 'src/assets/**/*.jpg' 'src/assets/**/*.jpeg' 'src/assets/**/*.webp')
          echo "archivos<<EOF" >> "$GITHUB_OUTPUT"
          echo "$ARCHIVOS" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Renombrar imágenes nuevas según su carpeta
        if: steps.nuevas.outputs.archivos != ''
        run: node scripts/rename-uploads.mjs "${{ steps.nuevas.outputs.archivos }}"

      - name: Detectar imágenes para comprimir (ya con los nombres nuevos)
        id: cambios
        run: |
          git add -A -- src/assets
          ARCHIVOS=$(git diff --name-only --diff-filter=ACMR --cached "${{ github.event.before }}" -- 'src/assets/**/*.png' 'src/assets/**/*.jpg' 'src/assets/**/*.jpeg' 'src/assets/**/*.webp')
          echo "archivos<<EOF" >> "$GITHUB_OUTPUT"
          echo "$ARCHIVOS" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Comprimir
        if: steps.cambios.outputs.archivos != ''
        run: node scripts/compress-images.mjs "${{ steps.cambios.outputs.archivos }}"

      - name: Commitear si algo se renombró o se achicó
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A -- src/assets src/content
          if ! git diff --cached --quiet; then
            git commit -m "chore: renombrar y comprimir imágenes subidas [skip ci]"
            git push
          else
            echo "Nada para renombrar/comprimir (ya estaba prolijo)."
          fi
