backend:
  name: github
  repo: devdeploystudio/proyecto-s3
  branch: main
  # Proxy de login por GitHub OAuth (Cloudflare Worker sveltia-cms-auth).
  base_url: https://sveltia-cms-auth.contact-deploystudio.workers.dev

# Permite probar el panel en local (npm run dev) sin pasar por GitHub:
# corriendo `npx decap-server` en otra terminal, escribe directo a los
# archivos locales. No se usa en el sitio publicado (ahí manda `backend`).
local_backend: true

media_folder: "src/assets"
public_folder: "src/assets"

# Sin esto, Sveltia muestra un panel de vista previa en vivo al lado del
# formulario y los campos de texto quedan comprimidos a la mitad del ancho
# de la pantalla. Se prende puntual (`editor: { preview: true }`) solo en
# las colecciones que sí tienen una plantilla de vista previa registrada
# (ver preview.js) - el resto se queda con el formulario a todo el ancho.
editor:
  preview: false

# El orden de la lista de acá abajo es a propósito el mismo orden en que el
# cliente encuentra estas cosas: primero cada pantalla de la home, de arriba
# a abajo tal cual se ve scrolleando; después el resto de las páginas, en el
# mismo orden en que aparecen en el menú del sitio (Estudio, Proyectos,
# Objeto, Contacto); General al final. Así el panel nunca obliga a
# "traducir" mentalmente entre lo que se ve acá y lo que se ve en el sitio.
collections:
  # --- Inicio (home), un archivo por cada pantalla que se ve scrolleando ---
  - name: "config-inicio-portada"
    label: "🏠 Inicio → Portada"
    description: "La imagen de fondo, la frase corta de arriba y el título grande de la primera pantalla de la home."
    editor: { preview: true }
    files:
      - name: "inicio-portada"
        label: "Portada"
        file: "src/content/config/inicio-portada.yaml"
        fields:
          - label: "Portada"
            name: "inicioPortada"
            widget: "object"
            fields:
              - { label: "ID (no tocar)", name: "id", widget: "hidden", default: "inicio-portada" }
              - { label: "Imagen de fondo", name: "heroImagen", widget: "image", media_folder: "/src/assets/inicio", public_folder: "../../assets/inicio", hint: "Arriba de esta foto va texto blanco. Elegí una imagen más bien oscura (o con esa zona oscura), si no el texto queda difícil de leer." }
              - { label: "Frase corta arriba del título", name: "heroEyebrow", widget: "string" }
              - { label: "Título principal", name: "heroTitulo", widget: "text" }
              - { label: "Párrafo debajo del título", name: "heroLead", widget: "text" }
              - { label: "Texto del botón hacia \"Proyectos\"", name: "heroCtaProyectosTexto", widget: "string", hint: "Es lo que se lee escrito dentro del botón. La flecha (→) forma parte del texto: dejala si querés que se vea." }
              - { label: "Texto del botón hacia \"Estudio\"", name: "heroCtaEstudioTexto", widget: "string", hint: "Es lo que se lee escrito dentro del botón. La flecha (→) forma parte del texto: dejala si querés que se vea." }

  - name: "config-inicio-estudio"
    label: "🏠 Inicio → El estudio"
    description: "La foto, el título, el texto y el botón del bloque \"El estudio\" en la home (el que invita a conocer el estudio). Es independiente de la foto de \"Estudio → Texto\": pueden ser fotos distintas."
    editor: { preview: true }
    files:
      - name: "inicio-estudio"
        label: "El estudio (adelanto en Inicio)"
        file: "src/content/config/inicio-estudio.yaml"
        fields:
          - label: "El estudio"
            name: "inicioEstudio"
            widget: "object"
            fields:
              - { label: "ID (no tocar)", name: "id", widget: "hidden", default: "inicio-estudio" }
              - { label: "Foto", name: "teaserFoto", widget: "image", media_folder: "/src/assets/equipo", public_folder: "../../assets/equipo" }
              - { label: "Mostrar en color", name: "teaserFotoColorOriginal", widget: "boolean", default: false, hint: "Las fotos de personas del sitio se muestran en blanco y negro por default (es la estética del sitio). Tildá esto solo si querés que ESTA foto puntual se vea en color." }
              - { label: "Frase corta arriba del título", name: "teaserEyebrow", widget: "string" }
              - { label: "Título", name: "teaserTitulo", widget: "string" }
              - { label: "Texto", name: "teaserTexto", widget: "text" }
              - { label: "Texto del botón hacia \"Estudio\"", name: "teaserBotonTexto", widget: "string", hint: "Es lo que se lee escrito dentro del botón. La flecha (→) forma parte del texto: dejala si querés que se vea." }

  - name: "config-inicio-proyectos"
    label: "🏠 Inicio → Proyectos"
    description: "La frase corta, el título y el botón del bloque de proyectos de la home (el carrusel). Los proyectos que se muestran en el carrusel se editan en \"Proyectos\"."
    editor: { preview: true }
    files:
      - name: "inicio-proyectos"
        label: "Proyectos (carrusel en Inicio)"
        file: "src/content/config/inicio-proyectos.yaml"
        fields:
          - label: "Proyectos"
            name: "inicioProyectos"
            widget: "object"
            fields:
              - { label: "ID (no tocar)", name: "id", widget: "hidden", default: "inicio-proyectos" }
              - { label: "Frase corta arriba del título", name: "proyectosEyebrow", widget: "string" }
              - { label: "Título", name: "proyectosTitulo", widget: "string" }
              - { label: "Texto del botón hacia \"Proyectos\"", name: "proyectosBotonTexto", widget: "string", hint: "Es lo que se lee escrito dentro del botón. La flecha (→) forma parte del texto: dejala si querés que se vea." }

  - name: "config-inicio-objeto"
    label: "🏠 Inicio → Objeto"
    description: "La frase corta, el título, el texto y el botón del bloque \"Objeto\" en la home (el que invita a conocer los muebles)."
    editor: { preview: true }
    files:
      - name: "inicio-objeto"
        label: "Objeto (adelanto en Inicio)"
        file: "src/content/config/inicio-objeto.yaml"
        fields:
          - label: "Objeto"
            name: "inicioObjeto"
            widget: "object"
            fields:
              - { label: "ID (no tocar)", name: "id", widget: "hidden", default: "inicio-objeto" }
              - { label: "Frase corta arriba del título", name: "objetoEyebrow", widget: "string" }
              - { label: "Título", name: "objetoTitulo", widget: "string" }
              - { label: "Texto", name: "objetoTexto", widget: "text" }
              - { label: "Texto del botón hacia \"Objeto\"", name: "objetoBotonTexto", widget: "string", hint: "Es lo que se lee escrito dentro del botón. La flecha (→) forma parte del texto: dejala si querés que se vea." }

  - name: "config-inicio-final"
    label: "🏠 Inicio → Bloque final"
    description: "El título, el texto, el botón y la imagen de fondo del último cartel de la home (\"¿Tenés un proyecto en mente?\")."
    editor: { preview: true }
    files:
      - name: "inicio-final"
        label: "Bloque final"
        file: "src/content/config/inicio-final.yaml"
        fields:
          - label: "Bloque final"
            name: "inicioFinal"
            widget: "object"
            fields:
              - { label: "ID (no tocar)", name: "id", widget: "hidden", default: "inicio-final" }
              - { label: "Imagen de fondo", name: "ctaImagen", widget: "image", media_folder: "/src/assets/inicio", public_folder: "../../assets/inicio", hint: "Arriba de esta foto va texto blanco. Elegí una imagen más bien oscura (o con esa zona oscura), si no el texto queda difícil de leer." }
              - { label: "Título", name: "ctaTitulo", widget: "string" }
              - { label: "Texto", name: "ctaTexto", widget: "text" }
              - { label: "Texto del botón de WhatsApp", name: "ctaBotonTexto", widget: "string", hint: "Es lo que se lee escrito dentro del botón. La flecha (→) forma parte del texto: dejala si querés que se vea." }

  # --- Estudio (página aparte) ---
  - name: "config-estudio"
    label: "👥 Estudio → Texto"
    description: "Se pueden agregar/borrar/reordenar los párrafos del texto de presentación arrastrando. La foto, el título y el texto de la página \"Estudio\", y los títulos de la sección del equipo."
    editor: { preview: true }
    files:
      - name: "estudio"
        label: "Texto de Estudio"
        file: "src/content/config/estudio.yaml"
        fields:
          - label: "Estudio"
            name: "estudio"
            widget: "object"
            fields:
              - { label: "ID (no tocar)", name: "id", widget: "hidden", default: "estudio" }
              - { label: "Foto", name: "foto", widget: "image", media_folder: "/src/assets/equipo", public_folder: "../../assets/equipo" }
              - { label: "Mostrar en color", name: "colorOriginal", widget: "boolean", default: false, hint: "Las fotos de personas del sitio se muestran en blanco y negro por default (es la estética del sitio). Tildá esto solo si querés que ESTA foto puntual se vea en color." }
              - { label: "Frase corta arriba del título", name: "eyebrow", widget: "string" }
              - { label: "Título", name: "titulo", widget: "string" }
              - label: "Texto de presentación (un párrafo por línea)"
                name: "textoNosotros"
                widget: "list"
                field: { label: "Párrafo", name: "parrafo", widget: "text" }
              - { label: "Sección del equipo: frase corta arriba del título", name: "equipoEyebrow", widget: "string", hint: "Es el texto chico que aparece arriba del título de la grilla de personas (después del texto de presentación)." }
              - { label: "Sección del equipo: título", name: "equipoTitulo", widget: "string" }
              - { label: "Texto cuando una persona no tiene foto", name: "fotoVacia", widget: "string", hint: "Se muestra en lugar de la foto de un integrante que todavía no tiene foto cargada." }

  - name: "config-estudio-final"
    label: "👥 Estudio → Bloque final"
    description: "El título, el texto, el botón y la imagen de fondo del último cartel de la página \"Estudio\" (\"Seguinos en Instagram\")."
    editor: { preview: true }
    files:
      - name: "estudio-final"
        label: "Bloque final de Estudio"
        file: "src/content/config/estudio-final.yaml"
        fields:
          - label: "Bloque final"
            name: "estudioFinal"
            widget: "object"
            fields:
              - { label: "ID (no tocar)", name: "id", widget: "hidden", default: "estudio-final" }
              - { label: "Imagen de fondo", name: "ctaImagen", widget: "image", media_folder: "/src/assets/estudio", public_folder: "../../assets/estudio", hint: "Arriba de esta foto va texto blanco. Elegí una imagen más bien oscura (o con esa zona oscura), si no el texto queda difícil de leer." }
              - { label: "Título", name: "ctaTitulo", widget: "string" }
              - { label: "Texto", name: "ctaTexto", widget: "text" }
              - { label: "Texto del botón de Instagram", name: "ctaBotonTexto", widget: "string", hint: "Es lo que se lee escrito dentro del botón. La flecha (→) forma parte del texto: dejala si querés que se vea." }

  - name: "equipo"
    label: "👥 Estudio → Equipo"
    label_singular: "Integrante"
    description: "Se pueden agregar, borrar y reordenar arrastrando. Las personas que aparecen en la grilla de la página \"Estudio\"."
    editor: { preview: true }
    folder: "src/content/equipo"
    create: true
    delete: true
    extension: "yaml"
    format: "yaml"
    identifier_field: nombre
    reorder: { key: orden }
    fields:
      - { label: "Foto", name: "foto", widget: "image", required: false, media_folder: "/src/assets/equipo", public_folder: "../../assets/equipo" }
      - { label: "Mostrar en color", name: "colorOriginal", widget: "boolean", default: false, hint: "Las fotos de personas del sitio se muestran en blanco y negro por default (es la estética del sitio). Tildá esto solo si querés que ESTA foto puntual se vea en color." }
      - { label: "Nombre", name: "nombre", widget: "string" }
      - { label: "Rol", name: "rol", widget: "string" }
      - { label: "Bio", name: "bio", widget: "text" }

  # --- Proyectos (página aparte, también aparecen en el carrusel de Inicio) ---
  - name: "config-proyectos-textos"
    label: "📁 Proyectos → Textos de las páginas"
    description: "Los textos fijos de la página \"Proyectos\" (el listado) y de la página individual de cada proyecto. Son los mismos para todos los proyectos: lo que cambia de uno a otro (título, tipo, concepto, fotos) se edita en \"Proyectos\"."
    editor: { preview: true }
    files:
      - name: "proyectos-textos"
        label: "Textos de las páginas de Proyectos"
        file: "src/content/config/proyectos-textos.yaml"
        fields:
          - label: "Proyectos"
            name: "proyectosTextos"
            widget: "object"
            fields:
              - { label: "ID (no tocar)", name: "id", widget: "hidden", default: "proyectos-textos" }
              - { label: "Listado: frase corta arriba del título", name: "listadoEyebrow", widget: "string", hint: "Es el texto chico de arriba de la página \"Proyectos\" (la que lista todos los proyectos)." }
              - { label: "Listado: título", name: "listadoTitulo", widget: "string" }
              - { label: "Listado: bajada", name: "listadoLead", widget: "text" }
              - { label: "Texto del botón de cada tarjeta", name: "tarjetaBotonTexto", widget: "string", hint: "Aparece al pie de cada tarjeta de proyecto, tanto en el listado como en el carrusel de la home. La flecha (→) forma parte del texto." }
              - { label: "Página de cada proyecto: link para volver", name: "volverTexto", widget: "string", hint: "Es el link chico de arriba de la página de un proyecto, que lleva de vuelta al listado." }
              - { label: "Página de cada proyecto: texto del botón de la presentación", name: "presentacionBotonTexto", widget: "string", hint: "Es lo que se lee escrito dentro del botón. La flecha (→) forma parte del texto: dejala si querés que se vea." }
              - { label: "Página de cada proyecto: título del concepto", name: "conceptoTitulo", widget: "string", hint: "Es el título que aparece arriba del texto del concepto de cada proyecto." }
              - { label: "Página de cada proyecto: título del bloque final", name: "ctaTitulo", widget: "string" }
              - { label: "Página de cada proyecto: texto del botón de WhatsApp", name: "ctaBotonTexto", widget: "string", hint: "Es lo que se lee escrito dentro del botón. La flecha (→) forma parte del texto: dejala si querés que se vea." }

  - name: "proyectos"
    label: "📁 Proyectos"
    label_singular: "Proyecto"
    description: "Se pueden agregar, borrar y reordenar arrastrando. Aparecen en la página \"Proyectos\" y en el carrusel de la home."
    editor: { preview: true }
    folder: "src/content/proyectos"
    create: true
    delete: true
    extension: "yaml"
    format: "yaml"
    identifier_field: titulo
    reorder: { key: orden }
    fields:
      - { label: "Tipo de proyecto", name: "tipo", widget: "string" }
      - { label: "Título", name: "titulo", widget: "string" }
      - { label: "Color de acento", name: "acento", widget: "color", hint: "Color del título y la etiqueta de este proyecto en las tarjetas y en su página. Elegí un tono con buen contraste sobre fondo claro (evitar colores muy pálidos o muy parecidos al blanco)." }
      - { label: "PDF de presentación", name: "presentacion", widget: "file", media_folder: "/public/pdfs", public_folder: "/pdfs" }
      - { label: "Portada", name: "cover", widget: "image", media_folder: "/src/assets/proyectos/{{slug}}", public_folder: "../../assets/proyectos/{{slug}}" }
      - { label: "Concepto (texto largo de la página del proyecto)", name: "concepto", widget: "text" }
      - label: "Galería"
        name: "galeria"
        widget: "list"
        hint: "Se pueden agregar, borrar y reordenar arrastrando."
        field: { label: "Imagen", name: "imagen", widget: "image", media_folder: "/src/assets/proyectos/{{slug}}", public_folder: "../../assets/proyectos/{{slug}}" }
      - { label: "Tarjeta (opcional, si difiere de la portada)", name: "tarjeta", widget: "image", required: false, media_folder: "/src/assets/proyectos/{{slug}}", public_folder: "../../assets/proyectos/{{slug}}", hint: "Solo para las tarjetas del listado y del carrusel. Si la dejás vacía, las tarjetas usan la portada." }
      - { label: "Resumen (tarjetas y listado)", name: "resumen", widget: "text" }

  # --- Objeto (página aparte, con su propio "sitio" de muebles) ---
  - name: "config-objeto"
    label: "🪑 Objeto → Texto y colores"
    description: "El texto y los colores se pueden reordenar y agregar/borrar arrastrando. Los textos de la página \"Objeto\", los textos que se repiten en cada pieza, la paleta de colores disponible y la frase corta del pie de página."
    editor: { preview: true }
    files:
      - name: "objeto"
        label: "Texto y colores de Objeto"
        file: "src/content/config/objeto.yaml"
        fields:
          - label: "Objeto"
            name: "objeto"
            widget: "object"
            fields:
              - { label: "ID (no tocar)", name: "id", widget: "hidden", default: "objeto" }
              - { label: "Frase corta arriba del título", name: "heroEyebrow", widget: "string" }
              - { label: "Título principal", name: "heroTitulo", widget: "string" }
              - label: "Texto de presentación (un párrafo por línea)"
                name: "textoObjeto"
                widget: "list"
                field: { label: "Párrafo", name: "parrafo", widget: "text" }
              - { label: "Texto del link a Instagram", name: "instagramTexto", widget: "string", hint: "Es el link que aparece debajo del texto de presentación. La flecha (→) forma parte del texto." }
              - { label: "Nota sobre encargos y medidas", name: "notaEncargo", widget: "text", hint: "Es el párrafo que aparece arriba de la lista de piezas." }
              - { label: "Cada pieza: nota debajo de las medidas", name: "tarjetaNota", widget: "string", hint: "Se repite igual en todas las piezas." }
              - { label: "Cada pieza: título de los colores", name: "tarjetaColoresTitulo", widget: "string", hint: "Es el título que aparece arriba de los círculos de colores de cada pieza." }
              - label: "Colores disponibles"
                name: "coloresObjeto"
                widget: "list"
                summary: "{{fields.nombre}}"
                fields:
                  - { label: "Nombre", name: "nombre", widget: "string", hint: "Usá este mismo nombre, tal cual, en el campo \"Color que muestra esta foto\" de cada pieza (en \"Objeto → Piezas\") para que el círculo de esa foto quede vinculado." }
                  - { label: "Color del círculo", name: "swatch", widget: "color" }
              - { label: "Cada pieza: texto del botón de consulta", name: "tarjetaBotonTexto", widget: "string", hint: "Es lo que se lee escrito dentro del botón. La flecha (→) forma parte del texto: dejala si querés que se vea." }
              - { label: "Texto de \"nuevas piezas\"", name: "proximamenteTexto", widget: "string", hint: "Es la frase que aparece al final de la lista de piezas." }
              - { label: "Frase corta del pie de página (debajo de \"Objeto\")", name: "footerTagline", widget: "string" }

  - name: "objeto-piezas"
    label: "🪑 Objeto → Piezas"
    label_singular: "Pieza"
    description: "Se pueden agregar, borrar y reordenar arrastrando. Las mesas y muebles que aparecen en la página \"Objeto\"."
    editor: { preview: true }
    folder: "src/content/objeto-piezas"
    create: true
    delete: true
    extension: "yaml"
    format: "yaml"
    identifier_field: nombre
    reorder: { key: orden }
    fields:
      - label: "Fotos"
        name: "foto"
        widget: "list"
        hint: "Se pueden agregar, borrar y reordenar arrastrando."
        summary: "{{fields.color}}"
        fields:
          - { label: "Imagen", name: "imagen", widget: "image", media_folder: "/src/assets/objeto/{{slug}}", public_folder: "../../assets/objeto/{{slug}}" }
          - { label: "Color que muestra esta foto (dejar vacío si es una foto general, sin color asociado)", name: "color", widget: "string", required: false, hint: "Tiene que decir EXACTAMENTE igual que uno de los nombres cargados en \"Objeto → Texto y colores\" (ej: \"Azul noche\"), si no el círculo de ese color no va a aparecer en esta pieza." }
      - { label: "Tipo (ej: mesa auxiliar)", name: "tipo", widget: "string" }
      - { label: "Nombre", name: "nombre", widget: "string" }
      - { label: "Medidas", name: "medidas", widget: "string" }
      - { label: "Precio (vacío = a consultar)", name: "precio", widget: "number", value_type: "int", required: false }

  # --- Contacto (página aparte) ---
  - name: "config-contacto"
    label: "✉️ Contacto → Textos"
    description: "Los textos de la página \"Contacto\" (títulos, botones y el link a Objeto) y su foto."
    editor: { preview: true }
    files:
      - name: "contacto"
        label: "Textos de Contacto"
        file: "src/content/config/contacto.yaml"
        fields:
          - label: "Contacto"
            name: "contacto"
            widget: "object"
            fields:
              - { label: "ID (no tocar)", name: "id", widget: "hidden", default: "contacto" }
              - { label: "Frase corta arriba del título", name: "eyebrow", widget: "string" }
              - { label: "Título", name: "titulo", widget: "string" }
              - { label: "Bajada", name: "lead", widget: "text" }
              - { label: "Texto del botón de WhatsApp", name: "whatsappTexto", widget: "string", hint: "Es lo que se lee escrito dentro del botón. La flecha (→) forma parte del texto: dejala si querés que se vea." }
              - { label: "Texto del botón de Instagram", name: "instagramTexto", widget: "string", hint: "Es lo que se lee escrito dentro del botón. La flecha (→) forma parte del texto: dejala si querés que se vea." }
              - { label: "Pregunta sobre Objeto (debajo de los botones)", name: "objetoPregunta", widget: "string", hint: "Es la frase chica que aparece debajo de los botones de contacto, antes del link a Objeto." }
              - { label: "Texto del link a Objeto", name: "objetoBotonTexto", widget: "string", hint: "Es lo que se lee escrito dentro del botón. La flecha (→) forma parte del texto: dejala si querés que se vea." }
              - { label: "Foto", name: "imagen", widget: "image", media_folder: "/src/assets/contacto", public_folder: "../../assets/contacto" }

  # --- General (no pertenece a una sola página) ---
  - name: "config"
    label: "⚙️ General"
    description: "Instagram, WhatsApp y email (se usan en botones de contacto de todo el sitio), el menú superior y la página de error 404: no pertenecen a una sola página."
    files:
      - name: "site"
        label: "Configuración general"
        file: "src/content/config/site.yaml"
        fields:
          - label: "Sitio"
            name: "site"
            widget: "object"
            fields:
              - { label: "ID (no tocar)", name: "id", widget: "hidden", default: "site" }
