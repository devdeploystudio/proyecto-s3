backend:
  name: github
  repo: devdeploystudio/proyecto-s3
  branch: main
  # Proxy de login por GitHub OAuth (Cloudflare Worker sveltia-cms-auth).
  base_url: https://sveltia-cms-auth.contact-deploystudio.workers.dev

# Permite probar el panel en local (npm run dev) sin pasar por GitHub:
# corriendo `npx decap-server` en otra terminal, escribe directo a los
# archivos locales. No se usa en el sitio publicado (ahí manda `backend`).
local_backend: true

media_folder: "src/assets"
public_folder: "src/assets"

collections:
  - name: "config-inicio"
    label: "🏠 Inicio → Textos"
    description: "El título grande de la portada y los dos bloques de \"El estudio\"/\"Objeto\" que aparecen en la home."
    files:
      - name: "inicio"
        label: "Textos de Inicio"
        file: "src/content/config/inicio.yaml"
        fields:
          - label: "Inicio"
            name: "inicio"
            widget: "object"
            fields:
              - { label: "ID (no tocar)", name: "id", widget: "hidden", default: "inicio" }
              - { label: "Imagen de fondo de la portada", name: "heroImagen", widget: "image", media_folder: "/src/assets/inicio", public_folder: "../../assets/inicio" }
              - { label: "Frase corta arriba del título principal", name: "heroEyebrow", widget: "string" }
              - { label: "Título principal (portada)", name: "heroTitulo", widget: "text" }
              - { label: "Título del bloque \"El estudio\"", name: "teaserTitulo", widget: "string" }
              - { label: "Texto del bloque \"El estudio\"", name: "teaserTexto", widget: "text" }
              - { label: "Título del bloque \"Objeto\"", name: "objetoTitulo", widget: "string" }
              - { label: "Texto del bloque \"Objeto\"", name: "objetoTexto", widget: "text" }
              - { label: "Imagen de fondo del bloque final (\"¿Tenés un proyecto en mente?\")", name: "ctaImagen", widget: "image", media_folder: "/src/assets/inicio", public_folder: "../../assets/inicio" }

  - name: "proyectos"
    label: "📁 Proyectos"
    label_singular: "Proyecto"
    description: "Aparecen en la página \"Proyectos\" y en el carrusel de la portada (Inicio)."
    folder: "src/content/proyectos"
    create: true
    delete: true
    extension: "yaml"
    format: "yaml"
    identifier_field: titulo
    reorder: { key: orden }
    fields:
      - { label: "Título", name: "titulo", widget: "string" }
      - { label: "Tipo de proyecto", name: "tipo", widget: "string" }
      - label: "Color de acento"
        name: "acento"
        widget: "select"
        options: [{ label: "Terracota", value: "terracota" }, { label: "Bordó", value: "bordo" }, { label: "Sage", value: "sage" }]
      - { label: "Resumen (tarjetas y listado)", name: "resumen", widget: "text" }
      - { label: "Concepto (texto largo de la página del proyecto)", name: "concepto", widget: "text" }
      - { label: "Portada", name: "cover", widget: "image", media_folder: "/src/assets/proyectos/{{slug}}", public_folder: "../../assets/proyectos/{{slug}}" }
      - { label: "Tarjeta (opcional, si difiere de la portada)", name: "tarjeta", widget: "image", required: false, media_folder: "/src/assets/proyectos/{{slug}}", public_folder: "../../assets/proyectos/{{slug}}" }
      - label: "Galería"
        name: "galeria"
        widget: "list"
        field: { label: "Imagen", name: "imagen", widget: "image", media_folder: "/src/assets/proyectos/{{slug}}", public_folder: "../../assets/proyectos/{{slug}}" }
      - { label: "PDF de presentación", name: "presentacion", widget: "file", media_folder: "/public/pdfs", public_folder: "/pdfs" }

  - name: "objeto-piezas"
    label: "🪑 Objeto → Piezas"
    label_singular: "Pieza"
    description: "Las mesas y muebles que aparecen en la página \"Objeto\"."
    folder: "src/content/objeto-piezas"
    create: true
    delete: true
    extension: "yaml"
    format: "yaml"
    identifier_field: nombre
    reorder: { key: orden }
    fields:
      - { label: "Nombre", name: "nombre", widget: "string" }
      - { label: "Tipo (ej: mesa auxiliar)", name: "tipo", widget: "string" }
      - { label: "Medidas", name: "medidas", widget: "string" }
      - { label: "Precio (vacío = a consultar)", name: "precio", widget: "number", value_type: "int", required: false }
      - label: "Fotos"
        name: "foto"
        widget: "list"
        summary: "{{fields.color}}"
        fields:
          - { label: "Imagen", name: "imagen", widget: "image", media_folder: "/src/assets/objeto/{{slug}}", public_folder: "../../assets/objeto/{{slug}}" }
          - { label: "Color que muestra esta foto (dejar vacío si es una foto general, sin color asociado)", name: "color", widget: "string", required: false }

  - name: "config-objeto"
    label: "🪑 Objeto → Texto y colores"
    description: "El texto de presentación de la página \"Objeto\" y la paleta de colores disponible para las piezas."
    files:
      - name: "objeto"
        label: "Texto y colores de Objeto"
        file: "src/content/config/objeto.yaml"
        fields:
          - label: "Objeto"
            name: "objeto"
            widget: "object"
            fields:
              - { label: "ID (no tocar)", name: "id", widget: "hidden", default: "objeto" }
              - label: "Texto de presentación (un párrafo por línea)"
                name: "textoObjeto"
                widget: "list"
                field: { label: "Párrafo", name: "parrafo", widget: "text" }
              - label: "Colores disponibles"
                name: "coloresObjeto"
                widget: "list"
                fields:
                  - { label: "Nombre", name: "nombre", widget: "string" }
                  - { label: "Color del círculo", name: "swatch", widget: "color" }

  - name: "equipo"
    label: "👥 Estudio → Equipo"
    label_singular: "Integrante"
    description: "Las personas que aparecen en la página \"Estudio\"."
    folder: "src/content/equipo"
    create: true
    delete: true
    extension: "yaml"
    format: "yaml"
    identifier_field: nombre
    reorder: { key: orden }
    fields:
      - { label: "Nombre", name: "nombre", widget: "string" }
      - { label: "Rol", name: "rol", widget: "string" }
      - { label: "Bio", name: "bio", widget: "text" }
      - { label: "Foto", name: "foto", widget: "image", required: false, media_folder: "/src/assets/equipo", public_folder: "../../assets/equipo" }

  - name: "config-estudio"
    label: "👥 Estudio → Texto"
    description: "El texto de presentación de la página \"Estudio\", la foto del equipo y el fondo del bloque final."
    files:
      - name: "estudio"
        label: "Texto de Estudio"
        file: "src/content/config/estudio.yaml"
        fields:
          - label: "Estudio"
            name: "estudio"
            widget: "object"
            fields:
              - { label: "ID (no tocar)", name: "id", widget: "hidden", default: "estudio" }
              - label: "Texto de presentación (un párrafo por línea)"
                name: "textoNosotros"
                widget: "list"
                field: { label: "Párrafo", name: "parrafo", widget: "text" }
              - { label: "Foto del equipo (aparece en Estudio y como adelanto en Inicio)", name: "foto", widget: "image", media_folder: "/src/assets/equipo", public_folder: "../../assets/equipo" }
              - { label: "Imagen de fondo del bloque final (\"Seguinos en Instagram\")", name: "ctaImagen", widget: "image", media_folder: "/src/assets/estudio", public_folder: "../../assets/estudio" }

  - name: "config-contacto"
    label: "✉️ Contacto → Textos"
    description: "El título, la bajada y la foto de la página \"Contacto\"."
    files:
      - name: "contacto"
        label: "Textos de Contacto"
        file: "src/content/config/contacto.yaml"
        fields:
          - label: "Contacto"
            name: "contacto"
            widget: "object"
            fields:
              - { label: "ID (no tocar)", name: "id", widget: "hidden", default: "contacto" }
              - { label: "Título", name: "titulo", widget: "string" }
              - { label: "Bajada", name: "lead", widget: "text" }
              - { label: "Foto", name: "imagen", widget: "image", media_folder: "/src/assets/contacto", public_folder: "../../assets/contacto" }

  - name: "config"
    label: "⚙️ General"
    description: "Instagram, WhatsApp y email — no pertenece a una sola página."
    files:
      - name: "site"
        label: "Configuración general"
        file: "src/content/config/site.yaml"
        fields:
          - label: "Sitio"
            name: "site"
            widget: "object"
            fields:
              - { label: "ID (no tocar)", name: "id", widget: "hidden", default: "site" }
              - { label: "Instagram — Estudio (link completo)", name: "instagramEstudio", widget: "string" }
              - { label: "Instagram — Objeto (link completo)", name: "instagramObjeto", widget: "string" }
              - { label: "WhatsApp (solo números, con código de país, ej: 5491122334455)", name: "whatsappNumero", widget: "string", required: false }
              - { label: "Email de contacto", name: "email", widget: "string" }
